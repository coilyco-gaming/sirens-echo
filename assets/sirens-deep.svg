<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t">
  <title id="t">sirens-deep</title>

  <defs>
    <!-- The water is inset to r 132, not the ring interior. That gap is load
         bearing: it keeps the lilac water off the lilac ring band, which would
         otherwise merge and swallow the lower half of the ring. -->
    <clipPath id="water"><circle cx="200" cy="200" r="132"/></clipPath>
  </defs>

  <rect width="400" height="400" fill="#14111b"/>

  <!-- The coilyco ring: mint outer band, lilac inner band. -->
  <circle cx="200" cy="200" r="165.5" fill="none" stroke="#4bcdd1" stroke-width="12"/>
  <circle cx="200" cy="200" r="153" fill="none" stroke="#baa6d9" stroke-width="13"/>

  <!-- Sea. -->
  <g clip-path="url(#water)">
    <rect x="0" y="228.16" width="400" height="171.84" fill="#baa6d9"/>
  </g>

  <!-- Whale. Every edge is horizontal or vertical except the two running from
       the fluke down to the belly. Only the eye is a circle. -->
  <g transform="translate(104,161.60) scale(1.28)">
    <path fill="#4bcdd1" d="M0 24 V16 H8 V8 H72 V30 H90
             V-20 H112 V4 H130 V-6 H150 V20
             L104 40 L88 64 H76 V80 H8 V72 H0 Z"/>
    <path fill="#14111b" d="M0 54 H50 V68 H0 Z"/>
    <circle cx="26" cy="30" r="8" fill="#14111b"/>
  </g>
</svg>
