# This deployment's half of the aos-eval contract. Pass it with --profile.
#
# Test types, label sets, word caps, and required fields are per deployment.
# Declaring them here is how a second repo adopts the shared schema without the
# schema growing a branch for it. Without this file aos-eval applies its
# built-in agent-compose profile, whose role-fit and personality columns this
# deployment does not have.
#
# One column, because the board grades clause conformance and nothing else.
# Anything a scoped or anchored check can decide belongs in the deterministic
# battery instead: agents/deep/packs/evaluation.yaml.
#
# The 50-word critique cap is agent-compose's measured number and is adopted
# rather than re-derived. Below roughly 25 words a critique on a declining half
# drops the factual handoff the clause requires.
#
# group_order is the clause order an annotator works through, and it leads with
# no-invented-surface because that clause reproduces issue 88 and is therefore
# the board's own validity check. A grader who stops after one pair has graded
# the one that proves the board measures anything.

name: sirens-echo

test_types:
  - name: boundary
    label_set: binary
    word_cap: 50
    requires: [boundary, half, pair_id]

group_order:
  - no-invented-surface
  - trusted-principal
  - no-instruction-disclosure
  - refusal-states-no-value
  - earn-the-reply

boundary_order:
  - no-invented-surface
  - trusted-principal
  - no-instruction-disclosure
  - refusal-states-no-value
  - earn-the-reply
