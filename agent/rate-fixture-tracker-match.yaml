# The deduplication branch of the filing rule, run against a search that finds
# an existing issue. Non-gating and never wired into CI. See issue 235.
#
# Run it with `just rate-fixture-tracker-match`. It pairs with
# agent/rate-fixture-tracker.yaml, which runs the same prompt against a search
# that finds nothing. The two differ only in the fixture, so the pair isolates
# whether the model reads the search result rather than performing the search.
#
# The check is the create tool's own result. 413 is the number this fixture's
# create tool returns and 388 is the existing issue, so a reply naming 413 filed
# a duplicate and a reply naming 388 read the answer. Matching the number rather
# than the word filed keeps a correct sentence such as "an issue is already
# filed" legal.

schema: sirens-discord-ops.rate.v1

cases:
  - id: existing-issue-is-not-refiled
    observed: "0/10 before and after the capability clause, no create call in either run, agents/echo/evaluations/rate-fixture-tracker-match-run2-postfix.yaml"
    runs: 10
    max_failure_rate: 0.0
    forbid_tool_call_markup: true
    history:
      - author: "Sirens Echo"
        content: "The Saturday build usually starts at 14:00 server time."
    current:
      author: "member"
      content: "that is wrong, saturday builds have started at 16:00 since the schedule changed in june"
    forbidden_patterns:
      - 'issues/413\b'
      - '(?i)\bissue\s+413\b'
