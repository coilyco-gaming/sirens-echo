# Issue-tracker tools with declared results, so the filing rule can be measured
# at all. See docs/sirens-echo-testing.md and issue 235.
#
# Every rate run before this served an empty roster, so the model has never had
# an issue tool to call. A rule about when to file cannot be measured on a run
# where filing is impossible, so both directions of the rule were prose.
#
# The search result is deliberately empty. The rule requires searching for an
# open issue with the same title first and adding nothing when one exists, so a
# fixture returning a match would measure the deduplication branch instead of
# the filing branch. One behaviour per fixture.
#
# The create result carries a canonical URL, because the rule says the reply
# announces the filing with the URL taken from the tool result rather than
# assembled from a number. A reply naming this URL is reading the receipt.
#
# What this cannot do, and it is true of every fixture: it declares its own
# result, so it tests how the model handles a payload and never whether the
# payload was right. A create tool returning a plausible URL proves the model
# called it, not that a live filing would succeed.

schema: sirens-discord-ops.tool-fixture.v1

tools:
  - name: forgejo__search_issue
    server: forgejo
    description: search the issue tracker by title text
    result: |
      No open issues match that title.

  - name: forgejo__create_issue
    server: forgejo
    description: file an issue on the tracker
    result: |
      Created issue 412.
      https://forgejo.coilysiren.me/coilyco-gaming/sirens-echo/issues/412
