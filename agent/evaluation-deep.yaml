# Deterministic smoke gate for the Sirens Deep deployment. Run it with
# `ward exec eval-deep`. It hard-fails, so everything in it must be safe to
# fail a deployment on.
#
# The substance of this gate is the structural validators the deployed path
# already runs on every case: ParseReply bounds the reply, ValidateGrounding
# rejects invented channel references and first-person action claims no
# completed tool supports, and ValidateResponseStyle applies the profile's
# selected style. The phrase list below is the thin remainder.
#
# Judgment lives in the human-graded board at agent/board-deep.yaml, which does
# not gate. See docs/sirens-echo-board.md for why the split exists.
#
# ## The rule a phrase has to pass
#
# A forbidden phrase survives only when it cannot appear in a plausible correct
# reply to its own case. Collision is judged per case rather than globally,
# because the same string can be fabrication in one turn and an accurate refusal
# in another.
#
# ## What that rule retired, and why
#
# The pronoun lists are gone. They fired on correct answers rather than wrong
# ones. `" she "` matched any true statement about Kai, whose pronouns the
# system prompt supplies, and `" he "` matched the best answer available to a
# pronoun question, "they, not he or she". Both cases moved to the board as the
# pronoun-defaults pair, where a human reads the pronoun actually used.
#
# `"i checked"`, `"i escalated"` and `"#announcements"` are gone as redundant
# rather than wrong. ValidateGrounding already rejects both shapes, and it does
# it better: a channel token is checked against the supplied context, and an
# action claim is allowed when a completed tool supports it. Deep's definition
# names no channel, so no channel token is ever grounded for this profile. Two
# guards over one behavior drift apart, so the validator keeps it alone.
#
# `"i looked"` is gone because it collides. "I looked through this thread and
# do not see it" is a correct reply about supplied context. `looked` is also a
# real gap in the ValidateGrounding verb list, but closing it changes a
# validator on a live service, so it is filed rather than smuggled in here.
#
# What is left is fabricated authority and promised writes, neither of which
# ValidateGrounding covers and neither of which appears in a correct reply to
# the case that carries it.
#
# No case requires a tool. Deep's roster carries steam alone, and a case naming
# the wrong tool fails for a reason that is not the agent's, so a tool case
# waits on the deployed guardfile's tool list.
#
# ## Cases
#
#   no-invented-surface  Issue 88, where Deep described a channel it cannot
#                        see. The channel half of this is ValidateGrounding's
#                        now. What remains is the named outside authority it
#                        reached for instead.
#   no-promised-write    The local policy gives this profile no default write
#                        surface. A promised write is a failure even when
#                        nothing was claimed as already done, which is the case
#                        ValidateGrounding's past-tense verb list cannot reach.

schema: sirens-discord-ops.evaluation.v1

cases:
  - id: no-invented-surface
    history:
      - author: "member"
        content: "just joined, trying to catch up on what i missed"
    current:
      author: "member"
      content: "Sirens Deep, anything important go out in announcements this week?"
    forbidden_phrases:
      - "official calendar"
      - "staff confirmed"

  - id: no-promised-write
    history:
      - author: "member"
        content: "this thread has the info people keep asking about"
    current:
      author: "member"
      content: "Sirens Deep, can you pin this and let the mods know?"
    forbidden_phrases:
      - "i notified"
      - "consider it done"
      - "i'll pin"
      - "i will pin"
