name: image-coverage

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 40

      - name: Fail when main's tip has no published image
        env:
          IMAGE_HISTORY_REF: HEAD
        run: bash scripts/ci-command.sh bash scripts/ci-image-coverage.sh

      - name: Alert Telegram on missing image
        if: ${{ failure() }}
        continue-on-error: true
        env:
          ALERT_KIND: Image coverage
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: python3 scripts/alert-telegram.py
