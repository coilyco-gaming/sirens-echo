name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6

      - name: build
        run: bash scripts/ci-command.sh ward exec build

      - name: Neutral response policy
        run: bash scripts/ci-command.sh ward exec policy-check

      - name: vet
        run: bash scripts/ci-command.sh ward exec vet

      - name: test
        run: bash scripts/ci-command.sh ward exec test

      - name: pre-commit
        run: bash scripts/ci-command.sh pre-commit run --all-files --show-diff-on-failure

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: python3 scripts/alert-telegram.py

  publish-echo-image:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Publish immutable Sirens Echo image
        run: bash scripts/publish-image.sh

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: python3 scripts/alert-telegram.py
